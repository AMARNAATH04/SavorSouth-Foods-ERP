services:
  postgres:
    image: postgres:16-alpine
    container_name: savorsouth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savorsouth_erp
    ports:
      - "5432:5432"
    volumes:
      - savorsouth_pgdata:/var/lib/postgresql/data

volumes:
  savorsouth_pgdata:
